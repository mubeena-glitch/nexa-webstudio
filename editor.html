<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NEXA Studio — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--a:#9354FF;--a2:#E9DDFF;--bg:#f5f5f8;--bd:rgba(0,0,0,.08);--tx:#16162a;--mu:#6e6e88;--dw:340px}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
.hd{height:56px;background:#fff;border-bottom:1px solid var(--bd);padding:0 22px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:10}
.hd-left{display:flex;align-items:center;gap:12px;min-width:0}
.hd-left .logo{font-size:15px;font-weight:800;letter-spacing:-.4px}
.hd-left .logo b{color:var(--a)}
.hd-left .tname{font-size:12px;color:var(--mu);border-left:1px solid var(--bd);padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.hd-right{display:flex;gap:8px;align-items:center}
.hbtn{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--tx);font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hbtn:hover{border-color:var(--a);color:var(--a)}
.hbtn.pri{background:var(--a);color:#fff;border-color:var(--a)}
.hbtn.pri:hover{opacity:.88;color:#fff}

.wrap{display:flex;height:calc(100% - 56px)}
.drawer{width:var(--dw);flex-shrink:0;background:#fff;border-right:1px solid var(--bd);overflow-y:auto;padding:18px 18px 60px}
.grp{margin-bottom:22px}
.grp-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:#fff;color:var(--mu);transition:.14s;font-family:inherit}
.chip:hover{border-color:var(--a);color:var(--a)}
.chip.ac{background:var(--a);color:#fff;border-color:var(--a)}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--mu);margin-bottom:4px}
.inp{width:100%;padding:8px 11px;border:1.5px solid var(--bd);border-radius:8px;font-size:12px;font-family:inherit;outline:none;color:var(--tx)}
.inp:focus{border-color:var(--a)}
textarea.inp{resize:vertical;min-height:54px;line-height:1.5}
.color-row{display:flex;gap:10px}
.color-cell{flex:1}
.color-cell input[type=color]{width:100%;height:36px;border:1.5px solid var(--bd);border-radius:8px;background:#fff;cursor:pointer;padding:3px}
.hint{font-size:10.5px;color:var(--mu);line-height:1.5;margin-top:6px}
.canvas{flex:1;background:#e9e9ef;position:relative;display:flex;align-items:stretch;justify-content:center;overflow:hidden}
.canvas iframe{width:100%;height:100%;border:0;background:#fff}
.cv-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mu);font-size:13px;background:#e9e9ef}
.sp{width:30px;height:30px;border:3px solid var(--a2);border-top-color:var(--a);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:#16162a;color:#fff;padding:11px 20px;border-radius:10px;font-size:12.5px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;transition:.28s;z-index:100;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:760px){.wrap{flex-direction:column}.drawer{width:100%;height:42%;border-right:0;border-bottom:1px solid var(--bd)}.canvas{height:58%}.hd-left .tname{display:none}}
</style>
</head>
<body>
<div class="hd">
  <div class="hd-left">
    <div class="logo">NEXA <b>Studio</b></div>
    <div class="tname" id="tname">Editor</div>
  </div>
  <div class="hd-right">
    <a class="hbtn" id="backBtn" href="templates.html">&#8592; Templates</a>
    <a class="hbtn" id="openBtn" href="#" target="_blank" rel="noopener">Open Original &#8599;</a>
    <button class="hbtn pri" onclick="exportHtml()">&#8681; Download HTML</button>
  </div>
</div>

<div class="wrap">
  <aside class="drawer">

    <div class="grp">
      <div class="grp-h">&#127912; Theme</div>
      <div class="chips" id="themeChips"></div>
    </div>

    <div class="grp">
      <div class="grp-h">&#129517; Hero Layout</div>
      <div class="chips" id="heroChips"></div>
    </div>

    <div class="grp">
      <div class="grp-h">&#127752; Brand Colours</div>
      <div class="color-row">
        <div class="color-cell"><label>Primary</label><input type="color" id="cPrimary" value="#9354ff" oninput="applyBrand()"></div>
        <div class="color-cell"><label>Secondary</label><input type="color" id="cSecondary" value="#656dfe" oninput="applyBrand()"></div>
      </div>
      <div class="hint">Drives buttons, links, and accents across the page.</div>
    </div>

    <div class="grp">
      <div class="grp-h">&#9999;&#65039; Hero Copy</div>
      <div class="fld"><label>Eyebrow</label><input class="inp" id="tEyebrow" oninput="applyHeroText()" placeholder="Small label above headline"></div>
      <div class="fld"><label>Headline</label><textarea class="inp" id="tHeadline" oninput="applyHeroText()" placeholder="Main headline"></textarea></div>
      <div class="fld"><label>Subhead</label><textarea class="inp" id="tSubhead" oninput="applyHeroText()" placeholder="Supporting sentence"></textarea></div>
      <div class="fld"><label>Button text</label><input class="inp" id="tCta" oninput="applyHeroText()" placeholder="e.g. Book a call"></div>
    </div>

    <div class="grp">
      <div class="grp-h">&#128221; Lead Form</div>
      <div class="chips" id="formChips"></div>
      <div class="hint">Swaps the form fields and CTA for a ready-made bundle.</div>
    </div>

    <div class="grp">
      <div class="grp-h">&#127970; Brand &amp; Footer</div>
      <div class="fld"><label>Logo image URL (optional)</label><input class="inp" id="tLogo" placeholder="https://…/logo.png" onchange="applyLogo()"></div>
      <div class="fld"><label>Email</label><input class="inp" id="fEmail" oninput="applyFooter()" placeholder="hello@brand.com"></div>
      <div class="fld"><label>Phone</label><input class="inp" id="fPhone" oninput="applyFooter()" placeholder="+971 4 000 0000"></div>
      <div class="fld"><label>Address</label><input class="inp" id="fAddress" oninput="applyFooter()" placeholder="Dubai, UAE"></div>
      <div class="fld"><label>Legal line</label><input class="inp" id="fLegal" oninput="applyFooter()" placeholder="© 2026 Brand. All rights reserved."></div>
    </div>

  </aside>

  <main class="canvas">
    <div class="cv-loading" id="cvLoad"><div class="sp"></div><p>Loading template…</p></div>
    <iframe id="cv" title="Template preview"></iframe>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
var THEMES=[['editorial','Editorial'],['minimal','Minimal'],['conversion','Conversion'],['luxury','Luxury'],['dark','Dark']];
var HEROES=[['form-right','Form right'],['image-split','Image split'],['centred','Centred'],['video','Video']];
var FORMS=[['lead-basic','Basic lead'],['consult-detailed','Consultation'],['booking-slot','Booking'],['newsletter-only','Newsletter']];

var qs=new URLSearchParams(location.search);
var id=(qs.get('t')||'').replace(/[^a-z0-9-]/gi,'');
var name=qs.get('name')||prettify(id);
var file=id?('templates/'+id+'.html'):'';
var iframe=document.getElementById('cv');
var ready=false, pendingExport=false;

function prettify(s){return (s||'Template').replace(/^[0-9]+-/,'').replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});}
function toast(m){var t=document.getElementById('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},1900);}
function send(msg){if(iframe.contentWindow)iframe.contentWindow.postMessage(msg,'*');}

// ---- build chip rows ----
function chipRow(elId,items,onPick,group){
  var box=document.getElementById(elId);
  box.innerHTML=items.map(function(it){return '<div class="chip" data-v="'+it[0]+'">'+it[1]+'</div>';}).join('');
  box.querySelectorAll('.chip').forEach(function(c){
    c.onclick=function(){
      box.querySelectorAll('.chip').forEach(function(x){x.classList.remove('ac');});
      c.classList.add('ac');
      onPick(c.getAttribute('data-v'));
    };
  });
}
function markChip(elId,val){var box=document.getElementById(elId);box.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('ac',c.getAttribute('data-v')===val);});}

chipRow('themeChips',THEMES,function(v){send({type:'nexa:set-theme',value:v});});
chipRow('heroChips',HEROES,function(v){send({type:'nexa:set-hero',value:v});});
chipRow('formChips',FORMS,function(v){send({type:'nexa:set-form',bundle:v});toast('Form swapped to &ldquo;'+v+'&rdquo;');});

// ---- apply handlers ----
function applyBrand(){send({type:'nexa:set-brand',primary:document.getElementById('cPrimary').value,secondary:document.getElementById('cSecondary').value});}
function applyHeroText(){
  send({type:'nexa:set-text',zone:'hero-copy',fields:{
    eyebrow:document.getElementById('tEyebrow').value,
    headline:document.getElementById('tHeadline').value,
    subhead:document.getElementById('tSubhead').value,
    cta:document.getElementById('tCta').value
  }});
}
function applyLogo(){var u=document.getElementById('tLogo').value.trim();if(u)send({type:'nexa:set-logo',url:u});}
function applyFooter(){send({type:'nexa:set-footer',data:{
  email:document.getElementById('fEmail').value,
  phone:document.getElementById('fPhone').value,
  address:document.getElementById('fAddress').value,
  legal:document.getElementById('fLegal').value
}});}

// ---- export ----
function exportHtml(){if(!ready){toast('Template still loading…');return;}pendingExport=true;send({type:'nexa:get-html'});toast('Preparing download…');}
function download(html){
  var blob=new Blob(['<!DOCTYPE html>\n'+html],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(id||'template')+'-edited.html';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast('Downloaded &mdash; opens with the kit if kept beside /templates/_shared');
}

// ---- messages from the template iframe ----
window.addEventListener('message',function(e){
  var m=e.data;if(!m||typeof m!=='object'||!m.type)return;
  if(m.type==='nexa:ready'){ready=true;document.getElementById('cvLoad').style.display='none';prefillText();}
  if(m.type==='nexa:html'&&pendingExport){pendingExport=false;download(m.html);}
});

// Pre-fill the hero-copy and footer inputs by reading the loaded template (same-origin on deploy).
function prefillText(){
  try{
    var doc=iframe.contentDocument;if(!doc)return;
    var z=doc.querySelector('[data-edit="hero-copy"]');
    if(z){
      setVal('tEyebrow',z.querySelector('[data-field="eyebrow"]'));
      setVal('tHeadline',z.querySelector('[data-field="headline"]'));
      setVal('tSubhead',z.querySelector('[data-field="subhead"]'));
      setVal('tCta',z.querySelector('[data-field="cta"]'));
    }
    var f=doc.querySelector('[data-edit="footer"]');
    if(f){
      setVal('fEmail',f.querySelector('[data-field="email"]'));
      setVal('fPhone',f.querySelector('[data-field="phone"]'));
      setVal('fAddress',f.querySelector('[data-field="address"]'));
      setVal('fLegal',f.querySelector('[data-field="legal"]'));
    }
    var theme=doc.body.getAttribute('data-theme');if(theme)markChip('themeChips',theme);
    var hero=doc.querySelector('.nx-hero');if(hero&&hero.getAttribute('data-hero'))markChip('heroChips',hero.getAttribute('data-hero'));
  }catch(err){/* cross-origin (e.g. file://) — drawer still drives via postMessage */}
}
function setVal(inputId,node){if(node)document.getElementById(inputId).value=(node.textContent||'').trim();}

// ---- boot ----
if(!id){
  document.getElementById('cvLoad').innerHTML='<p style="max-width:280px;text-align:center">No template selected. <a href="templates.html" style="color:var(--a);font-weight:600">Pick one from the gallery</a>.</p>';
}else{
  document.getElementById('tname').textContent=name;
  document.title='NEXA Studio — '+name;
  document.getElementById('openBtn').href=file;
  iframe.src=file;
  // Safety net: if the iframe never posts ready (older cache), hide loader after load.
  iframe.addEventListener('load',function(){setTimeout(function(){if(!ready){document.getElementById('cvLoad').style.display='none';ready=true;prefillText();}},600);});
}
</script>
</body>
</html>
